<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation</title>
    <link rel="stylesheet" href="statics/css/reservation.css">
    <link rel="stylesheet" href="statics/css/index.css">
</head>
<body class="reservation-page">
    <nav class="navbar">
            <a href="index.html" class="logo">Apex Motors</a>
            
             <div class="nav-links">
                <p><a href="#" class="active">Home</a></p>
                <p><a href="#">Inventory</a></p>
                <p><a href="#">About</a></p>
                <p><a href="#">Contact</a></p>
            </div>
         
            <a href="#" class="nav-btn">Book a Test Drive</a>
        </nav>
    <div class="container"> 
        <div class="reservation-form">
            <form action="submit_reservation.php" method="POST" class="form-grid">
                <div class="form-textarea" >
                    <h2>request a private consultation</h2>
                    <p>Provide your details below to secure your appointment</p>
                    <p class="form-para">An advisor will contact your within 24 hours</p>
                </div>
                <div class="form-container">
                    <div class="form-column">
                <div class="form-group">
                    <label for="fullname">FULL NAME</label>
                    <input type="text" id="fullname" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="phone">PHONE NUMBER</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number">
                </div>

                <div class="form-group">
                    <label for="date">PREFERRED DATE</label>
                    <div class="date-input-wrapper">
                    <input type="date" id="date">
                    </div>
                </div>
                </div>

                <div class="form-column">
                <div class="form-group">
                    <label for="email">EMAIL ADDRESS</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="vehicle">INTERESTED VEHICLE</label>
                    <select id="vehicle">
                    <option value="" disabled selected>Select a vehicle from our fleet...</option>
                    <option value="car1">Vehicle Option 1</option>
                    <option value="car2">Vehicle Option 2</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">MESSAGE / SPECIAL REQUISITIONS</label>
                    <textarea id="message" rows="3" placeholder="Tell us about your requirements..."></textarea>
                </div>
                </div>
                </div>
                <div class="form-btn" >
                    <button type="submit">SUBMIT CONSULTATION REQUEST</button>
                </div>
            </form>

        </div>
    </div>

</body>
</html>
