<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="statics/css/dbInventory.css">
</head>
<body>
    <p id="dashboardMessage" role="status" hidden></p>
    <div class="dashboard-wrapper" id="dashboardWrapper" hidden>
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="brand-header">
                <div class="brand">
                    <span>APEX</span>
                    <span>MOTORS</span>
                </div>
                <button class="close-sidebar-btn" id="closeSidebar">&times;</button>
            </div>

            <nav class="nav-menu">
                <a href="dbInventory.html" class="nav-item active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    <span>Inventory</span>
                </a>
                <a href="dbreservation.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span>Reservations</span>
                </a>
                <a href="#vehicleFormCard" class="nav-item" id="sidebarAddVehicle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                    <span>Add Vehicle</span>
                </a>
                <!-- Mobile-only Logout inside nav list -->
                <a href="API/logout.php" class="nav-item mobile-nav-logout">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span>Logout</span>
                </a>
            </nav>
        </div>

        <!-- Bottom-left Logout Button (Desktop & Sidebar Bottom) -->
        <div class="sidebar-bottom">
            <a href="API/logout.php" class="logout-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- TOP HEADER / NAVBAR -->
        <header class="top-navbar">
            <div class="header-left">
                <button class="hamburger-btn" id="openSidebar" aria-label="Open Menu">
                    <span></span><span></span><span></span>
                </button>
                <div class="title-block">
                    <span class="subtitle">APEX SHOWROOM</span>
                    <h1>INVENTORY MANAGEMENT</h1>
                </div>
            </div>

            <div class="header-actions">
                <!-- Shown on Desktop, Hidden on Mobile -->
                <button type="button" class="gold-btn desktop-add-btn" onclick="resetForm()">
                    + Add New Vehicle
                </button>
                <!-- Hidden on Desktop, Shown on Mobile -->
                <a href="API/logout.php" class="mobile-header-logout">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Logout
                </a>
            </div>
        </header>

        <!-- CONTENT GRID -->
        <div class="content-grid">
            <!-- LEFT: VEHICLE INVENTORY TABLE -->
            <section class="card table-card">
                <h2>Vehicle Inventory</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Model Name</th>
                                <th>Year</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="vehicleRows"></tbody>
                    </table>
                </div>
            </section>

            <!-- RIGHT: ADD / EDIT VEHICLE FORM -->
            <section class="card form-card" id="vehicleFormCard">
                <h2 id="formTitle">Add New Vehicle</h2>
                <form action="API/actions.php" method="POST" enctype="multipart/form-data" id="vehicleForm">
                    <input type="hidden" name="veh_id" id="veh_id">
                    <input type="hidden" name="existing_image" id="existing_image">

                    <div class="form-group">
                        <label for="make_model">Make & Model</label>
                        <input type="text" id="make_model" name="make_model" placeholder="e.g. Jaguar C-X75" required>
                    </div>

                    <div class="form-group">
                        <label for="year">Year</label>
                        <input type="number" id="year" name="year" placeholder="e.g. 2024" required>
                    </div>

                    <div class="form-group">
                        <label for="price">Price</label>
                        <input type="text" id="price" name="price" placeholder="e.g. 1150000" required>
                    </div>

                    <div class="form-group">
                        <label for="engine">Engine Specs</label>
                        <input type="text" id="engine" name="engine" placeholder="e.g. 3.9L Twin-Turbo V8" required>
                    </div>

                    <div class="form-group">
                        <label>Image Upload</label>
                        <div class="drop-zone" id="dropZone" onclick="document.getElementById('imageInput').click()">
                            <input type="file" name="image" id="imageInput" accept="image/*" hidden>
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c5a467" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            <p id="dropText">Drag-and-drop zone</p>
                        </div>
                    </div>

                    <div class="form-group status-row">
                        <label>Status (<span id="statusLabelText">In Stock</span>)</label>
                        <label class="switch">
                            <input type="checkbox" name="status" id="statusToggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" name="save_vehicle" class="gold-btn save-btn" id="submitBtn">Save Vehicle</button>
                        <button type="button" class="cancel-btn" onclick="resetForm()">Cancel</button>
                    </div>
                </form>
            </section>
        </div>
    </main>
</div>

<script src="statics/js/dbInventory.js" ></script>


</body>
</html>
