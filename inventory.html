<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore a curated selection of premium vehicles at Apex Motors.">
    <title>Inventory | Apex Motors</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="statics/css/inventory.css">
    <link rel="stylesheet" href="statics/css/index.css">
    <link rel="stylesheet" href="statics/css/navbar.css">
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="logo">Apex Motors</a>

        <div class="nav-links">
            <p><a href="index.html">Home</a></p>
            <p><a href="inventory.html" class="active">Inventory</a></p>
            <p><a href="about.html">About</a></p>
            <p><a href="#">Contact</a></p>
        </div>

        <a href="reservation.html" class="nav-btn">Book a Test Drive</a>
    </nav>

    <main class="inventory-page">
        <section class="inventory-tools" aria-label="Search and filter inventory">
            <label class="search-control" for="inv_searchbar">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input type="search" placeholder="Search..." id="inv_searchbar">
            </label>

            <select name="inv_year" id="inv_year" aria-label="Filter by year">
                <option value="">Year</option>
            </select>

            <select name="inv_type" id="inv_type" aria-label="Filter by vehicle type">
                <option value="">Type</option>
            </select>

            <select name="inv_brand" id="inv_brand" aria-label="Filter by brand">
                <option value="">Brand</option>
            </select>

            <div class="price-filter">
                <button class="price-filter-toggle" id="price_filter_toggle" type="button"
                    aria-label="Choose a price range" aria-expanded="false" aria-controls="price_filter_panel">
                    <span id="price_filter_label">Price Range</span>
                    <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                </button>
                <section class="price-filter-panel" id="price_filter_panel" aria-label="Price range options" hidden>
                    <h2 class="price-panel-title">Price</h2>
                    <div class="price-preset-pills" aria-label="Preset price ranges">
                        <button class="price-pill" type="button" data-min="" data-max="25000">Below $25K</button>
                        <button class="price-pill" type="button" data-min="25000" data-max="50000">$25K - $50K</button>
                        <button class="price-pill" type="button" data-min="50000" data-max="150000">$50K -
                            $150K</button>
                        <button class="price-pill" type="button" data-min="150000" data-max="300000">$150K -
                            $300K</button>
                        <button class="price-pill" type="button" data-min="300000" data-max="">Over $300K</button>
                    </div>
                    <div class="price-inputs-row">
                        <label class="price-input-group" for="min_price">
                            <span>Min Price ($)</span>
                            <input type="number" id="min_price" min="0" placeholder="Min">
                        </label>
                        <span class="price-separator" aria-hidden="true">-</span>
                        <label class="price-input-group" for="max_price">
                            <span>Max Price ($)</span>
                            <input type="number" id="max_price" min="0" placeholder="Max">
                        </label>
                    </div>
                    <p class="price-error" id="price_error" role="alert" hidden>Enter a valid range: minimum must not
                        exceed maximum.</p>
                    <div class="price-panel-actions">
                        <button class="price-reset" id="price_reset" type="button">Reset</button>
                        <button class="price-show" id="price_show" type="button">Show</button>
                    </div>
                </section>
            </div>

            <select name="inv_sort" id="inv_sort" aria-label="Sort vehicles">
                <option value="">Sort By</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="year-new">Year: Newest</option>
            </select>
        </section>

        <p class="inventory-count" id="inventory_count" aria-live="polite">Loading inventory...</p>

        <section class="vehicle-grid" id="vehicle_grid" aria-label="Available vehicles"></section>
        <p class="empty-message" id="empty_message" role="status">Loading vehicles...</p>

    </main>

    <!-- Vehicle Details Modal (outside main so overflow/z-index can't clip it) -->
    <div class="modal-overlay" id="vehicle_modal">
        <div class="modal-content" role="dialog" aria-labelledby="modal_heading" aria-modal="true">
            <button class="modal-close" id="modal_close" type="button" aria-label="Close details">&times;</button>
            <div class="modal-body">
                <div class="modal-image">
                    <img id="modal_img" src="" alt="">
                    <span class="modal-status" id="modal_status"></span>
                </div>
                <div class="modal-details">
                    <h2 id="modal_heading"></h2>
                    <ul class="modal-specs">
                        <li><strong>Year:</strong> <span id="modal_year"></span></li>
                        <li><strong>Make:</strong> <span id="modal_make"></span></li>
                        <li><strong>Model:</strong> <span id="modal_model"></span></li>
                        <li><strong>Price:</strong> <span id="modal_price"></span></li>
                        <li><strong>Engine:</strong> <span id="modal_engine"></span></li>
                        <li><strong>Vehicle Type:</strong> <span id="modal_type"></span></li>
                        <li><strong>Color:</strong> <span id="modal_color"></span></li>
                    </ul>
                    <a class="modal-reserve-btn" href="reservation.html">Reserve This Vehicle</a>
                </div>
            </div>
        </div>
    </div>

    <script src="statics/js/inventory.js"></script>
</body>

</html>
